services:

  web:
    build: .
    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_HOST: redis

    depends_on:
      - db
      - redis

    ports:
      - "8000:8000"

    volumes:
      - .:/app

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

volumes:
  postgres_data: